name: Migrar histórico do simulador

on:
  push:
    branches: [main]
    paths: [.github/workflows/migrar-historico.yml]

permissions:
  contents: write

jobs:
  migrar:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publicar as cinco versões
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/thiagofurtadoferreira/AG.git 5001ebb23a29a47dece0dae06f26a9da6ff84841
          source_commit=$(git rev-parse FETCH_HEAD)
          git diff --quiet
          mapfile -t commits < <(git rev-list --reverse "$source_commit" -- simuladorCotacao)
          test "${#commits[@]}" -eq 5
          workflow_blob=$(git rev-parse HEAD:.github/workflows/migrar-historico.yml)
          parent=$(git rev-parse HEAD)
          tags=()
          for original in "${commits[@]}"; do
            git read-tree "$original:simuladorCotacao"
            git update-index --add --cacheinfo "100644,$workflow_blob,.github/workflows/migrar-historico.yml"
            if [[ "$original" == "$source_commit" ]]; then
              doc_blob=$(git show "$original:simuladorCotacao/MANUTENCAO.md" | sed 's/a branch `simulador-cotacao` como base para mudanças nesta pasta/a branch `main` como base para mudanças/' | git hash-object -w --stdin)
              git update-index --cacheinfo "100644,$doc_blob,MANUTENCAO.md"
            fi
            version=$(git show "$original:simuladorCotacao/VERSION")
            parent=$(git show -s --format=%B "$original" | git commit-tree "$(git write-tree)" -p "$parent")
            git tag "v$version" "$parent"
            tags+=("refs/tags/v$version")
          done
          git push --atomic origin "$parent:refs/heads/main" "${tags[@]}"
